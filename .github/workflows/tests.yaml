name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  black-auto-fix:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install black
        run: pip3 install black
      - name: Apply black formatting
        run: black .
      - name: Auto-commit formatting changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format with black"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>

  black-formatted:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install black
        run: pip3 install black
      - name: Verify black formatting
        run: black . --check

  py-linted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install pylint
        run: pip3 install pylint
      - name: Run pylint
        run: pylint custom_components/libbry_libs/

  imports-sorted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install isort
        run: pip3 install isort
      - name: Run isort
        run: isort . --diff --check --profile black

  test-pr:
    if: github.event_name == 'pull_request'
    needs: [black-formatted, py-linted, imports-sorted]
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install homeassistant
          pip install pytest pytest-asyncio python-dotenv

      - name: Run tests
        env:
          LIBRARY_USER_ID: ${{ secrets.LIBRARY_USER_ID }}
          LIBRARY_PIN: ${{ secrets.LIBRARY_PIN }}
          MUNICIPALITY: ${{ secrets.MUNICIPALITY }}
        run: pytest -q

  test-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [black-auto-fix, py-linted, imports-sorted]
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install homeassistant
          pip install pytest pytest-asyncio python-dotenv

      - name: Run tests
        env:
          LIBRARY_USER_ID: ${{ secrets.LIBRARY_USER_ID }}
          LIBRARY_PIN: ${{ secrets.LIBRARY_PIN }}
          MUNICIPALITY: ${{ secrets.MUNICIPALITY }}
        run: pytest -q

  semantic-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python-semantic-release
        run: |
          python -m pip install --upgrade pip
          pip install python-semantic-release

      - name: Create semantic release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release publish