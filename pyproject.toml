[project]
name = "libbry-homeassistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.2",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "pytest>=9.0.3",
    "pytest-cov>=5.0.0",
    "pylint>=3.3.1",
    "pytest-asyncio>=0.24.0",
    "python-dotenv>=1.0.1",
    "isort>=5.13.2",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
asyncio_mode = "auto"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["custom_components/libbry_libs/manifest.json:version"]
branch = "main"
upload_to_pypi = false
upload_to_release = true
build_command = "echo 'No build step configured'"
commit_message = "chore(release): {version} [skip ci]"
